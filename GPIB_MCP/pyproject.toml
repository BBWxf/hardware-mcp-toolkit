[project]
name = "gpib-mcp"
version = "0.1.0"
description = "通过 MCP 控制 GPIB/VISA 仪器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.1,<3",
    "PyVISA>=1.16,<2",
]

[project.scripts]
gpib-mcp = "gpib_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyvisa-sim>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
